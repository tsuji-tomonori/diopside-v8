advisories: []
residual_risks:
  - 利用者報告ではimmutable subjectとTargetDeploymentRegionを使う既存access stackのdeploy経路は成功済みだが、このPRが追加するenqueue role、request FIFO、private-backfill-enqueue environment protectionと変数はrepository外の前提であり、この変更作業では実環境を検証していない。
  - access stackをGitHubEnqueueOidcSubject付きで更新し、environment変数を設定するまではworkflowは安全に失敗する。この変更作業ではAWS deployを行っていない。
  - 実SQS enqueueと下流Lambdaのsmokeは行っていない。初回は既知の1動画、対象account・region、AWS料金を人が確認し、run-scoped deduplicationを含む処理結果を観測する必要がある。

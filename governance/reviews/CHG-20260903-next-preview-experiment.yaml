residual_risks:
  - 公開配信側またはYouTube取得仕様の変更により再実行が失敗する可能性がある。Cookieやloginへ自動切替せず、有限の手動再試行に留める。
  - 自動字幕を基に時刻を選定しているため軽微な表示文言差が残る可能性がある。実音声と映像の技術検証後、必要なら別変更で文言を微調整する。

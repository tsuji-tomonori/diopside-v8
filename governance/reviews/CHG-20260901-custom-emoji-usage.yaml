residual_risks:
  - 公開チャットリプレイはYouTube側で取得不能または後日変更される可能性があり、表示値はupdatedAt時点のsnapshotである。
  - 先行対象は3動画だけで、残る1701動画は人が明示した有限更新で匿名集計を追加するまでチャートを表示しない。
  - production deploy、公開、push、mergeは実行しておらず、最終結果の正本は現在HEADに対するGitHub Actionsと人のPR確認で確定する。

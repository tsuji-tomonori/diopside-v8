advisories: []
residual_risks:
  - 現在のリポジトリ設定ではGitHub ActionsによるPR作成が禁止されているため、設定を有効化するまではrelease branchから人がPRを作成する必要がある。
  - release PRを人がmergeするまで公開版は更新されない。
  - release PRのmainマージ後、https://tme.page.diopside.net/ のHTML、asset、latest、index、代表動画shardをHTTP smoke testと実機操作で確認する。

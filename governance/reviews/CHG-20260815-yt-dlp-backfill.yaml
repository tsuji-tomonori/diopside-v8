residual_risks:
  - 実AWS deploy、ECR push、manifest upload、SQS enqueue、実動画backfillは本PRの権限外であり、別途の明示承認とpilotが必要である。
  - worker imageのcontainer scanはCIで必須化したが、この作業環境ではDocker daemonが使えないためローカル実行はしていない。
  - private S3の実データ統合検証は認証済みの隔離環境でのみ実行し、raw素材をGitまたはPRへ持ち込まない。

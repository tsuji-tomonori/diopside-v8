residual_risks:
- 公開ja-orig全trackのraw SHA-256 f60fa6f3d071ad0cbd816a49ff35dc20e72d2a7197696dd32b133e9dfeb66ffcは旧候補と一致。正規化後のinputFingerprintは38137a10f429b936b0386564aa8ea28cac009afebecfa71d8236a1c11d5a0d4c。4333cue、0–20687秒の全track処理範囲を確認した。
- 修正時刻候補hash 0f6638df8295d4a89bd40201aa4169ea5b0a4c7bc2037d4a02bf0f8985d60c00。あらすじ候補hash 3a8190ea55c58586cc3f0c06edc9b26a26ffb34d6874b2d1885927d108d5f4bd。旧候補hashのレビュー結果は新候補へ転用していない。
- 原音声は通常native/MP3取得が無効HTMLとなり確認できていない。1204秒の表記補正を要する引用を外し、967.920秒の字幕と完全一致する配信者発話へ変更。話者は前後の実況文脈で独立確認した。全編の音声・映像視聴を実施したとは扱わない。
- 生字幕・音声・投稿者識別子をGitへ保存しない。冒頭・休憩・末尾の字幕空白を無音や映像の種類と断定しない。
- 今回の独立確認はnativeの別文脈レビューと正式決定的validatorによる。codex exec、batch harness、Sol監査を実行したとは記録しない。Draftを維持し、ready化・merge・公開は行わない。

residual_risks:
  - YouTube側でチャンネル画像が将来更新された場合は自動同期しない。npm run refresh:people-icons -- --allを明示実行し、レビュー可能な差分として更新する。
  - YouTube HTMLのog:imageが取得できない場合はscript全体を失敗させ、文字プレースホルダーへ自動退避しない。
  - 公開データとmain/docsはsource PRのマージ後に既存の「mainマージ後の静的成果物更新」workflowが別PRとして決定生成する。

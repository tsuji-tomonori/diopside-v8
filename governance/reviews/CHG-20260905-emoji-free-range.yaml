residual_risks:
  - 既存の1分集計を利用するため、内訳は選択範囲に重なる区間の合計となる。平均密度は集計区間の尺で計算し、選択秒数による過大表示を避ける。
  - 秒単位の再生位置は選べるが、長時間動画のポインタ操作精度は画面幅に依存する。矢印キーと秒数入力で微調整できる。

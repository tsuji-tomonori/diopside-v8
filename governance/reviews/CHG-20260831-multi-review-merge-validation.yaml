residual_risks:
  - 複数reviewを含むPRのsquash mergeは各commitの証跡をmerge後の履歴から復元できないため、従来どおり単一reviewだけを許可してfail-closedする。
  - PR #1384直後の失敗runは履歴に残り、本修正をmergeした後の新しいmain runで品質ゲート回復を確認する必要がある。

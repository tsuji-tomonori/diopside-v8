residual_risks:
  - GitHub Pages設定上の独自ドメインとHTTPSの到達性は、GitHubの反映完了後に公開URLで確認する必要がある。
  - ドメイン登録・DNSの料金が既存のゼロ円公開運用条件に影響する場合は、公開更新を停止して所有者が費用判断する。
  - 生成設計インベントリを追従更新したため、以後の方針スクリプト変更時も同じ生成手順を実行する必要がある。
  - 最新mainのコラボ相手・コンビ別ページを取り込んだ。独自ドメイン方針の変更はその公開機能と独立しているため、両方の回帰検証を維持する。

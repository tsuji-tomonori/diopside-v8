residual_risks:
  - 現在作成済みの3動画は承認済み公開字幕由来であり、対応する公開コメントまたはチャットを取得して全語を人が確認するまでは出典を字幕と明示したまま維持する。
  - YouTube側の公開コメント・チャット提供状況や構造は動画ごとに異なり、取得不能または有効語20語未満では承認済み代替資料へフォールバックする。
  - SVGの文字境界は決定的な近似値で衝突を避けており、将来フォントを変更する場合は実ブラウザ画面と配置試験を再確認する。

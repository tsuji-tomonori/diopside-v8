  - 実AWSへのupload、KMS encrypt/decrypt、DynamoDB条件更新は未実行であり、明示承認後に少数video IDのpilotが必要である。
  - 1,598件の約84GB超をS3へ保存・再読する転送時間、KMS request、S3保存費用は実accountとregionで確認が必要である。
  - 投稿者名やchannel IDを構造化fieldから除いても、コメント本文またはチャット本文が自己申告の識別情報を含む可能性は残るためnormalized copyもprivate S3に限定する。

residual_risks:
  - PRをmergeしてmain後生成workflowが完了するまで、公開URLの既存HTMLは旧asset pathのままである。
  - merge後にhttps://tme.page.diopside.net/のHTML、/assets/*.js、/assets/*.css、/data/latest.json、代表動画shardをHTTP smoke testで再確認する必要がある。
  - 公開後のroot配信確認が完了するまで、operations/acceptance-evidence.jsonのPages受入記録は現行mainの証跡から更新しない。
  - GitHub PagesのCNAME・HTTPS設定やDNSをこのPRでは変更しない。

residual_risks:
  - GitHubの通常merge subject形式が将来変わった場合はfail-closedで停止するため、その時点で明示的な契約更新が必要になる。
  - ローカル全体検証では既存operations testが環境依存でtimeoutしたが、今回変更したvalidator試験とrepository policy試験、および実際に失敗したmain merge commitの再検証は成功している。

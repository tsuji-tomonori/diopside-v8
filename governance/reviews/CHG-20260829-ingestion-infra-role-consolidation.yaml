residual_risks:
  - AWS access stack更新は未実行である。更新前は共有roleにsqs:SendMessageがないためenqueueはAccessDeniedとなり、merge後に既存stackのchange setで旧enqueue role削除と共有roleへの固定SQS権限追加だけを確認して管理者が更新する必要がある。
  - GitHub environment設定は変更していない。enqueue workflowは既存private-backfill-infraのAWS_ACCOUNT_ID、AWS_REGION、AWS_DEPLOY_ROLE_ARNを使うため、required reviewer、main限定、bypass禁止を初回実行前に管理者が再確認する必要がある。
  - 実AWSでのOIDC session policy、SQS enqueue、下流Lambdaのsmokeは行っていない。初回は既知の1動画、対象account・region、料金、MessageId、下流状態を人が確認する必要がある。

advisories: []
residual_risks:
  - WSLのdrvfs mountではchmod 0600がmode表示へ反映されず、/mnt/d配下のprivacyはWindows ACLへ依存する。traceはcontent-freeだがraw workspace全体にはprivate ACLが必要である。
  - SIGKILLまたは電源断ではinvocation_startedが最後のeventとして残り得る。次回実行で既存manifestを回復し新しいinvocationを追記するが、自動的に過去eventをcompletedへ書き換えない。

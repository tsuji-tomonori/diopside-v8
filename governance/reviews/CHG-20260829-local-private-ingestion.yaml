residual_risks:
  - 実AWS stack更新は未実行である。更新時はSQS request/DLQの未処理messageが失われ、Lambda、event source、worker IAM roleが削除されるため、運用者がCloudFormation change setとqueue不要性を確認してから別途deployする必要がある。
  - 旧worker CloudWatch Log GroupはDeletionPolicy Retainによりstack管理外へ残り、費用を継続する可能性がある。保存要否を確認した後の別の明示承認操作でのみ削除する。
  - 実YouTubeおよび実AWSでのローカルingestは、対象video ID・account・region・bucket・table・料金の明示判断が必要なため本変更では実行していない。Motoのloopback AWS protocol試験でclaimからS3 manifest・DynamoDB終端までを検証し、初回は運用者PCで既知1動画をpilotする。

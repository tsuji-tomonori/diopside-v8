residual_risks:
  - ChatGPT Workの物理同時thread数と実際の子モデル起動はcomposerとサービス側に依存するため、promptでGPT-5.6 Sol highとLuna mediumを明示し、10論理slotをqueue実行する
  - Workの子agentは親のconnectorと権限を継承するため物理的には書込み可能であり、親専用command、状態gate、prompt契約で共有書込みを防止する
  - 公開YouTube、yt-dlp、ffmpeg、faster-whisper model取得がdrain期限まで利用不能な場合は台帳を書き換えずdeferred_recovery checkpointから再開する

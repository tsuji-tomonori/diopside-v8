residual_risks:
  - 現在の実行環境にはDocker daemonがないためFloci container自体の実行結果は未取得であり、現在HEADのGitHub Actions Floci stepを外部正本として確認する必要がある。Moto HTTP serverによる同一試験はローカルで成功した。
  - emulatorとin-process Lambda handlerはAWS Lambda runtime・event source mappingの完全な同等性を保証しないため、main merge後のdeployで別の一動画を投入し、SQS再試行とDynamoDB終端状態をsmoke確認する。production AWSへの書込みはこの変更では行わない。

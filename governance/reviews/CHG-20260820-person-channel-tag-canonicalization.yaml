  - 公開版・Pages成果物は通常PRへ含めず、mainマージ後の既存release workflowが検証済み正本から生成する。
  - ローカル環境ではChromium取得の権限待ちによりPlaywright E2Eを完走できなかったため、PR HEADのGitHub Actionsで確認する。

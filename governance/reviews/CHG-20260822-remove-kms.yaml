residual_risks:
  - 実AWS deploy、既存object再暗号化、KMS key無効化・削除予約は未実行であり、別の明示承認とCloudFormation change set確認が必要である。
  - 既存stackの旧KMS keyはDeletionPolicy RetainによりCloudFormation管理外で残り、別途廃止するまで月額費用が残り得る。
  - 旧keyを参照するSSE-KMS objectがある場合、SSE-S3へ再暗号化してchecksumを再検証する前にkeyを削除するとobjectを復号できなくなる。
  - service標準暗号化ではcustomer-managed key固有のrotation、無効化、key policyによる一元統制を利用しない。

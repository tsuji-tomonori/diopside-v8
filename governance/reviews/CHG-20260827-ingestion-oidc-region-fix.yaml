residual_risks:
  - 実AWS stack更新とGitHub Actions deployは未実行であり、Draft PRをmergeした後に既存us-east-1 stackのchange setを確認して更新する必要がある。
  - GitHub environmentのrequired reviewer、main限定、bypass禁止はrepository外設定であり、添付画面では未設定のためdeploy前に管理者が設定する必要がある。
  - AWS accountのOIDC providerとap-northeast-1のmodern CDK bootstrap roleの実在・trust thumbprintはrepositoryから検証できない。

residual_risks:
  - 15分以内に完了しない動画はretry後にDLQへ入り、素材取得を完了しない。
  - 実AWS deployでは既存Batch、ECR、VPC、EventBridgeと関連資源が削除対象になるため、明示承認後にCloudFormation change set確認が必要である。
  - 実AWSでのLambda zip起動、外部取得、KMS暗号化uploadは未実行であり、認証済み隔離環境でpilot確認が必要である。

residual_risks:
  - 実AWS deployと既存access log bucketの内容確認・削除は未実行であり、別の明示承認とCloudFormation change set確認が必要である。
  - 既存access log bucketはDeletionPolicy Retainによりstack管理外へ残り、別途削除するまでS3保存費用が残り得る。
  - S3 server access loggingを使わないためobject request単位の専用access logは残らず、CloudWatch Logsはworkerの安全な状態codeだけを保持する。

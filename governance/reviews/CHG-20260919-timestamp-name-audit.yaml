advisories: []
residual_risks:
- 形態素解析で固有名詞または未知名詞2223語を抽出。既存taxonomyと部分一致しない1665語は一般名詞・略称・分割断片を含み、1665件の誤記を意味しない。ラベル全文と既存同作品・人物表記で点検し、確定した19見出しのみ訂正。
- カンカンノン（階段怪談）、トリスビアス、エディオンパーク、オムナオト（本人チャンネル）、SUQQUアクフォンス、司賀りこ、シラクル（Ciracle公式ショップ）は実在名称を確認し維持。
- 訂正catalogは表記確認の根拠であり全編を再視聴した証拠ではない。事実・編集の過去レビューと候補hashはそのまま保存し、再審査済みと偽らない。
- 原本の新規レビュー、開始秒変更、ラベル更新があれば適用を失敗させるため、catalogの再確認・削除が必要。公開後は対象13動画の全19訂正と時刻URLを確認する。
- 追加照合でセルヴァをセーバル、ヘクションムーンをへくしょいムーン、原老院を元老院と同定。ブルースイートワインはケサネ等で用いられる酒の名称であるため維持。該当場面の逐語録・コメント本文は保存せず出典と判断だけを記録する。

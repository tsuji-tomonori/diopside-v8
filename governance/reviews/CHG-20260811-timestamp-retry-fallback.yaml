residual_risks:
  - drain期限までに回復できない動画は台帳へ安全な理由と再開手順だけを記録し、処理不能にせずdeferred_recoveryから再開する
  - 長時間字幕は最大3 chunkを並行mapするため、実行環境の負荷に応じてDIOPSIDE_TRANSCRIPT_MAP_WORKERSを1から4で調整する
  - worker-side shell読取失敗を避けるため字幕JSONLと検証済みmapを直接入力し、生成方式versionが古いmap、読取失敗、placeholderを決定的に拒否する
  - 上限付き局所feedback loop後も決定的validatorまたは親Sol確認に合格しない候補は正本化しない

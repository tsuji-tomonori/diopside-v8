residual_risks:
- 文字起こしの全編品質、語彙と意味のハイブリッド検索、全動画の素材生成、新着自動処理は本変更では未実装・未有効化。
- 母数は現行除外適用後の登録済み動画。別チャンネル出演と旧別視点除外167件は個別根拠の再確認を要する。
- 既存PR snapshotはlockではない。実行前の最新PR、正本指紋、除外の確認と原子的claimが必要で、古いclaimを自動奪取しない。
- クラウド環境のsocket制限でChromiumが起動せず、追加E2E6件を含むブラウザ検証は実行できていない。公式CIの結果を確認するまでready扱いしない。
- 初見利用者の実測と月次請求確認は既存の許可済み未完了項目として残る。merge・deployは所有者が行う。

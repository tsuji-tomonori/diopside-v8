residual_risks:
  - YouTube側の公開状態、cookie要否、字幕・chat・comment提供状況によりartifact単位で取得不能になり得るが、partial statusと既存artifact保持で顕在化する。
  - 音声量に応じてGit LFSのquotaとprivateリポジトリ容量を消費するため、保存先ownerが利用量を監視する必要がある。
  - 現環境ではprivateリポジトリ作成credentialを使った実結合試験を行わず、GitHub REST応答を模した独立testでvisibilityとwrite権限境界を検証した。

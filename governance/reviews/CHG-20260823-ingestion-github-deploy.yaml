residual_risks:
  - AWS accountのGitHub OIDC provider、modern CDK bootstrap、GitHub environment protectionはrepository外の前提であり、実環境では未確認である。
  - 受けロールは委譲先を限定するが、CloudFormationExecutionRoleの実効権限とguardrailは対象AWS accountのbootstrap設定に依存する。
  - 実AWS deployとpost-deploy smokeは行っておらず、初回はCloudFormation change setと保持対象resourceを人が確認する必要がある。

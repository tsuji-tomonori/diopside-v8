residual_risks:
  - 公開字幕全1200行を2026-10-27にYouTubeの「文字起こしを表示」から再取得・確認した。入力fingerprintは4c85d85e59e038f6f661649fe8fc5b2dea58d51308b5d7f97587eea4ed18b7ed（UTF-8 JSON.stringify(rows,null,2)と末尾LF）。元の6002e01cの取得bytesを検証したとは扱わない。
  - 修正候補のタイムスタンプhashは9297ec6ae78b2d8e4789cf354f9d8f1396fd81f8e8128079daaf5a0e3349f7cb、あらすじhashは8bdb467110aa9eb0c7509ba64f94add2f092a6f263b03f567307e664c113e36e。あらすじは引用符込み123文字。
  - 事実確認はverify_diopside_video_evidence、編集確認はreview_final_video_editorialの別コンテキストで重大指摘0件。編集者へ事実確認結果と内容変更理由は渡していない。既存IDを保持する機械的な理由のみ伝達したため、全ての著者理由を隠したとの主張はしない。
  - 公開字幕に基づく確認であり、全編の音声・映像の通視聴や声による本人認証は行っていない。引用7886秒は当該発言を含む最初の字幕cue開始秒であり、単語単位の発声開始時刻を確認したとは扱わない。字幕の無い区間を音声確認済みの無音と断定しない。
  - 本修正は有限の直接作業であり、codex execや専用ハーネスを実行したとは扱わない。生字幕・視聴者識別子・内部review原文は一時領域のみで、Gitや公開成果物には残さない。
  - 固定総数問題は別保守PR2740で既存14ID保持と新着全件検証へ分離済み。件数を15へ固定し直したり14以上へ弱めていない。内容PR2739の同一head品質ゲート成功をマージ前に確認する。
  - あらすじは別コンテキストで事実・ネタバレ/プライバシー・編集確認を実施し同一hashで合格。ネタバレ/プライバシー担当review_diopside_video_editorialは最終候補の他review結果を未読だが、旧候補の埋込みfact status/hashは以前見ているためstrict fresh contextを主張しない。最終編集担当には旧・最終の他review結果を開示していない。

residual_risks:
  - 本変更は原因修正ではなく安全な観測性追加であり、merge後にLambdaをdeployして一動画を再試行し、signalからbot challenge、JS runtime、API transport、HTTP、DNS、TLS等を切り分ける必要がある。
  - 実AWS deploy、SQS再投入、CloudWatch Logs確認は未実行であり、現在失敗中のmessageとDynamoDB状態を本PRでは変更しない。

residual_risks:
  - 実AWS stack更新とGitHub Actions deployは未実行であり、Draft PRをmergeした後に既存us-east-1 stackのchange setを確認して更新する必要がある。
  - GitHub environmentのrequired reviewer、main限定、bypass禁止はrepository外設定であり、設定完了をdeploy前に管理者が確認する必要がある。
  - repositoryの移管・owner名またはrepository名の変更時はGitHub APIのsub_claim_prefixを再確認し、同じIDを含む新しい完全一致subjectへtrustを更新する必要がある。

residual_risks:
  - PO Token providerはYouTubeの継続的なenforcement変更へ依存し、403解消を保証しない。失敗時は認証・Cookieへ自動切替せずretryable artifactとして残す。
  - bgutil-ytdlp-pot-providerとnative providerはGPL-3.0である。sourceをrepositoryへvendorせずlocal runtime toolとして分離したが、配布形態を変更する場合はlicense条件を再確認する。
  - native providerはlocal processでありOS再起動後に自動起動しない。運用者は取得前にloopback health checkを行う。

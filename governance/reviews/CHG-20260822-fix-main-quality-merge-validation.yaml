residual_risks:
  - github.refがrefs/heads/main以外の手動実行はPR相当の直接Commit Comment検証となるため、merge commitを持つ別branchでは意図どおりfail-closedする。
  - 失敗済みmain run自体は更新されず、このPRをmergeした後のmain runで回復を確認する必要がある。

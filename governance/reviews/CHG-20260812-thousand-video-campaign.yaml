residual_risks:
  - Hosted Workの物理同時thread数はサービス側に依存するため、10論理laneをqueueとして維持する
  - YouTube到達許可とCLI導入はWork環境に依存するため、preflight不合格時はclaimせずresumeAfter付きcheckpointへpauseする
  - campaign branchへのconnector更新はリポジトリ外のcompare-and-set実行であり、CIはaction payloadと競合時の禁止契約までを検証する

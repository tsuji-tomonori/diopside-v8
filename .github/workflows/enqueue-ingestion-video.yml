name: 1動画private backfill投入

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: SQSへ投入する11文字のYouTube video_id
        required: true
        type: string
      confirmation:
        description: 料金・利用量・契約条件を確認済みの場合は ENQUEUE と入力
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enqueue-ingestion-video
  cancel-in-progress: false

jobs:
  enqueue:
    name: 検証済みvideo_idをFIFOへ1件投入
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: private-backfill-infra
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      VIDEO_ID: ${{ inputs.video_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: main・確認入力・対象AWS資源を検証
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRMATION" = 'ENQUEUE'
          [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          test "$AWS_REGION" = 'ap-northeast-1'
          test "$AWS_DEPLOY_ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/diopside-github-actions-deploy"
      - name: GitHub OIDCで短期AWS資格情報を取得
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: diopside-enqueue-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"SendOnlyToIngestionRequestQueue","Effect":"Allow","Action":"sqs:SendMessage","Resource":"arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:diopside-ingestion-request.fifo"}]}
      - name: video_idだけをSQS FIFOへ送信
        run: |
          message_body="$(jq -cn --arg video_id "$VIDEO_ID" '{video_id:$video_id}')"
          queue_url="https://sqs.$AWS_REGION.amazonaws.com/$AWS_ACCOUNT_ID/diopside-ingestion-request.fifo"
          message_id="$(aws sqs send-message \
            --region "$AWS_REGION" \
            --queue-url "$queue_url" \
            --message-body "$message_body" \
            --message-group-id "$VIDEO_ID" \
            --message-deduplication-id "github-actions:${GITHUB_RUN_ID}:${VIDEO_ID}" \
            --query MessageId \
            --output text)"
          test -n "$message_id"
          {
            echo '### SQS投入結果'
            echo "- video_id: \`$VIDEO_ID\`"
            echo "- MessageId: \`$message_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

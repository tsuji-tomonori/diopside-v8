name: 要件・品質ゲート

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript・単体・E2E・生成差分
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      IS_GENERATED_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'automation/generated-release-') }}
      IS_GENERATED_RELEASE_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '🚀 release(data):') }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git worktreeを信頼済みに設定
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 固定依存を導入
        run: npm ci
      - name: PRのrelease生成物スコープを検査
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" && [[ "$HEAD_BRANCH" == automation/generated-release-* ]]; then
            release_source_commit="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
            npm run validate:release-pr-scope -- --base "$release_source_commit" --allow-generated-only
          else
            npm run validate:release-pr-scope -- --base "$BASE_SHA"
          fi
      - name: レビュー検証依存を導入
        run: python -m pip install --requirement governance/reviews/requirements.txt
      - name: PR・非main通常変更の品質ゲートを実行
        if: env.IS_GENERATED_RELEASE_PR != 'true' && env.IS_GENERATED_RELEASE_MAIN != 'true' && github.ref != 'refs/heads/main'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run verify:local:base
          python governance/reviews/validate.py --root . --commit "$PR_HEAD_SHA"
          npm run verify:generated
          npm run test:e2e:run
      - name: main通常変更の品質ゲートを実行
        if: env.IS_GENERATED_RELEASE_PR != 'true' && env.IS_GENERATED_RELEASE_MAIN != 'true' && github.ref == 'refs/heads/main'
        run: npm run verify:main-release
      - name: release変更の品質ゲートを実行
        if: env.IS_GENERATED_RELEASE_PR == 'true' || env.IS_GENERATED_RELEASE_MAIN == 'true'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if test "$IS_GENERATED_RELEASE_PR" = 'true'; then
            review_source_commit="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
          else
            review_source_commit="$(git rev-parse HEAD^)"
          fi
          npm run verify:local:base
          python governance/reviews/validate.py --root . --commit "$review_source_commit" --allow-github-merge-fallback
          npm run verify:generated
          npm run test:e2e:run
      - name: 要件の受入結果を監査
        if: always()
        run: npm run audit:requirements

  ingestion-infra:
    name: 有限private backfill（Python・uv・CDK）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: uvを準備
        uses: astral-sh/setup-uv@v5
      - name: Python依存をlockどおり導入
        run: uv sync --directory infra --locked --all-groups
      - name: CDK CLIをlockどおり導入
        run: npm ci --prefix infra
      - name: Ruff・strict型検査・pytestを実行
        run: |
          uv run --directory infra ruff format --check .
          uv run --directory infra ruff check .
          uv run --directory infra pyright
          uv run --directory infra mypy .
          uv run --directory infra pytest -q
      - name: Flociでローカルrunner・DynamoDB・S3統合経路を実行
        run: npm run test:ingestion:floci
      - name: CDK synthとcdk-nagを実行
        run: cd infra && npm exec -- cdk synth --quiet
      - name: as-built CDK設計差分を検査
        run: npm run check:ingestion-design

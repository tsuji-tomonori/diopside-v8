name: 要件・品質ゲート

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript・単体・E2E・生成差分
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IS_GENERATED_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'automation/generated-release-') }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: 固定依存を導入
        run: npm ci
      - name: PRのrelease生成物スコープを検査
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if test "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" && [[ "$HEAD_BRANCH" == automation/generated-release-* ]]; then
            release_source_commit="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
            npm run validate:release-pr-scope -- --base "$release_source_commit" --allow-generated-only
          else
            npm run validate:release-pr-scope -- --base "$BASE_SHA"
          fi
      - name: レビュー検証依存を導入
        run: python -m pip install --requirement governance/reviews/requirements.txt
      - name: Chromiumを導入
        run: npx playwright install --with-deps chromium
      - name: 通常変更の品質ゲートを実行
        if: env.IS_GENERATED_RELEASE_PR != 'true'
        run: npm run verify:quality
      - name: release PRの品質ゲートを実行
        if: env.IS_GENERATED_RELEASE_PR == 'true'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          review_source_commit="$(git merge-base "origin/$BASE_BRANCH" HEAD)"
          npm run verify:local:base
          python governance/reviews/validate.py --root . --commit "$review_source_commit"
          npm run verify:generated
          npm run test:e2e:run
      - name: 要件の受入結果を監査
        if: always()
        run: npm run audit:requirements

  ingestion-infra:
    name: 有限private backfill（Python・uv・CDK）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: uvを準備
        uses: astral-sh/setup-uv@v5
      - name: Python依存をlockどおり導入
        run: uv sync --directory infra --locked --all-groups
      - name: CDK CLIをlockどおり導入
        run: npm ci --prefix infra
      - name: Ruff・strict型検査・pytestを実行
        run: |
          uv run --directory infra ruff format --check .
          uv run --directory infra ruff check .
          uv run --directory infra pyright
          uv run --directory infra mypy .
          uv run --directory infra pytest -q
      - name: CDK synthとcdk-nagを実行
        run: cd infra && npm exec -- cdk synth --quiet
      - name: as-built CDK設計差分を検査
        run: python .agents/skills/generate-implementation-design/scripts/designflow.py cdk --template infra/cdk.out/DiopsideIngestionStack.template.json --out docs/design/generated/cdk/diopside-ingestion --repo-root . --check
      - name: worker imageをbuild
        run: docker build --file infra/worker/Dockerfile --tag diopside-ingestion-worker:${{ github.sha }} infra
      - name: worker imageを脆弱性検査
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: diopside-ingestion-worker:${{ github.sha }}
          version: v0.74.0
          format: table
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

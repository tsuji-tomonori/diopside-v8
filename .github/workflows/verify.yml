name: 要件・品質ゲート

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript・単体・E2E・生成差分
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: 固定依存を導入
        run: npm ci
      - name: レビュー検証依存を導入
        run: python -m pip install --requirement governance/reviews/requirements.txt
      - name: Chromiumを導入
        run: npx playwright install --with-deps chromium
      - name: 143要件の品質ゲートを実行
        run: npm run verify:quality
      - name: 143要件の受入結果を監査
        if: always()
        run: npm run audit:requirements
